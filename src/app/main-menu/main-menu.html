<div class="menu-container">
  <h1 class="lime">Jeopardy Relic</h1>
  <div class="cards-container">
    <mat-card
        class="menu-card"
        [class.menu-card--no-pointer]="isAddingPlayers()"
    >
        @if (!isAddingPlayers()) {
            <div
                (click)="goToAddPlayers()"
                class="full-size"
            >
                <mat-card-header>
                    <h2>Start Game</h2>
                </mat-card-header>
                <mat-card-content>
                    <div class="icon-container">
                        <mat-icon class="menu-icon">play_arrow</mat-icon>
                    </div>
                </mat-card-content>
            </div>
        } @else {
            <mat-card-header>
                <div class="action-bar">
                    <mat-icon
                        (click)="cancelAddPlayers()"
                        class="back-button"
                    >chevron_left</mat-icon>
                    <mat-icon
                        (click)="startGame()"
                        class="back-button"
                    >play_arrow</mat-icon>
                </div>
            </mat-card-header>
            <mat-card-content>
                <app-add-players
                    [playerNames]="playerNames()"
                    (onPlayerAdd)="onPlayerAdd($event)"
                    (onPlayerRemove)="onPlayerRemove($event)"
                >
                </app-add-players>
            </mat-card-content>
        }
    </mat-card>
    <mat-card class="menu-card">
        <div class="full-size">
            <mat-card-header>
                <h2>Relics</h2>
            </mat-card-header>
            <mat-card-content>
                <div class="icon-container">
                    <mat-icon class="menu-icon">toys</mat-icon>
                </div>
            </mat-card-content>
        </div>
    </mat-card>
    <mat-card class="menu-card">
        <div class="full-size">
            <mat-card-header>
                <h2>Relic Groups</h2>
            </mat-card-header>
            <mat-card-content>
                <div class="icon-container">
                    <mat-icon class="menu-icon">hive</mat-icon>
                </div>
            </mat-card-content>
        </div>
    </mat-card>
  </div>
</div>
